<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖庫系統</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background: #1a1a1a; color: #fff; height: 100vh; }

        /* 登入頁
        #: all id = login-page */
        #login-page {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        /* .: all class = login-box*/
        .login-box {
            background: #2a2a2a;
            padding: 40px;
            border-radius: 12px;
            width: 320px;
        }
        .login-box h2 { margin-bottom: 24px; text-align: center; }
        .login-box input {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            background: #3a3a3a;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
        }
        .login-box button {
            width: 100%;
            padding: 10px;
            background: #4a9eff;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        .login-box button:hover { background: #3a8eef; }

        /* 主頁面 */
        #main-page { display: none; height: 100vh; flex-direction: column; }

        /* 頂部 */
        .topbar {
            background: #2a2a2a;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 主體 */
        .content { display: flex; flex: 1; overflow: hidden; }

        /* 左側創作者清單 */
        .sidebar {
            width: 200px;
            background: #2a2a2a;
            padding: 16px;
            overflow-y: auto;
        }
        .sidebar h3 { margin-bottom: 12px; font-size: 14px; color: #aaa; }
        .artist-item {
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 4px;
        }
        .artist-item:hover { background: #3a3a3a; }
        .artist-item.active { background: #4a9eff; }

        /* 右側圖片牆 */
        .gallery {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 12px;
            align-content: start;
        }

        .image-card img {
            width: 100%;
            height: auto;
            display: block;
        }.image-card.selected { outline: 3px solid #4a9eff; }

        .image-card { position: relative;}

        .downloaded-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(74, 158, 255, 0.9);
            color: #fff;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .downloaded-badge svg {
            width: 14px;
            height: 14px;
        }

        /* 底部工具列 */
        .bottombar {
            background: #2a2a2a;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .bottombar button {
            padding: 8px 20px;
            background: #4a9eff;
            border: none;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
        }
        .bottombar button:hover { background: #3a8eef; }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<!-- 登入頁 -->
<div id="login-page">
    <div class="login-box">
        <h2>圖庫系統</h2>
        <input type="text" id="username" placeholder="帳號">
        <input type="password" id="password" placeholder="密碼">
        <div style="display: flex; gap: 8px;">
            <button onclick="login()">登入</button>
            <button onclick="regist()">註冊</button>
        </div>
    </div>
</div>

<!-- 主頁面 -->
<div id="main-page">
    <div class="topbar">
        <span>圖庫系統</span>
        <div style="display:flex; gap:8px;">
            <input type="text" id="search-tag" placeholder="搜尋 tag..." 
                style="padding:6px 10px; background:#3a3a3a; border:none; border-radius:6px; color:#fff;">
            <button onclick="searchImages()" 
                    style="padding:6px 12px; background:#4a9eff; border:none; border-radius:6px; color:#fff; cursor:pointer;">搜尋</button>
            <button onclick="loadImages()" 
                    style="padding:6px 12px; background:#555; border:none; border-radius:6px; color:#fff; cursor:pointer;">重置</button>

        </div>
        <div style="display:flex; align-items:center; gap:8px;">
            <span id="user-info"></span>
            <button onclick="logout()"
                    style="padding:6px 12px; background:#f66; border:none; border-radius:6px; color:#fff; cursor:pointer;">登出</button>
        </div>
    </div>
    <div class="content">
        <div class="sidebar">
            <h3>創作者</h3>
            <div id="artist-list"></div>
            <hr style="border-color:#444; margin: 12px 0;">
            <button onclick="toggleAddArtist()" 
                    style="width:100%; padding:8px; background:#4a9eff; border:none; border-radius:6px; color:#fff; cursor:pointer;">
                + 新增創作者
            </button>
            <div id="add-artist-form" style="display:none; margin-top:12px;">
                <input type="text" id="artist-name" placeholder="名稱" 
                    style="width:100%; padding:6px; margin-bottom:6px; background:#3a3a3a; border:none; border-radius:6px; color:#fff;">
                <input type="text" id="artist-platform" placeholder="平台" value="artstation"
                    style="width:100%; padding:6px; margin-bottom:6px; background:#3a3a3a; border:none; border-radius:6px; color:#fff;">
                <button onclick="addArtist()" 
                        style="width:100%; padding:8px; background:#4a9eff; border:none; border-radius:6px; color:#fff; cursor:pointer;">
                    新增
                </button>
            </div>
        </div>
        <div class="gallery" id="gallery"></div>
    </div>
    <div class="bottombar">
        <span id="selected-count">已選取 0 張</span>
        <button onclick="downloadSelected()">下載選取</button>
        <button onclick="deleteimage()" style="background:#f66;">刪除選取</button>
    </div>
</div>

<!-- 爬取中 modal -->
<div id="crawl-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:9999; align-items:center; justify-content:center;">
    <div style="background:white; padding:2rem; border-radius:8px; text-align:center; color:#333;">
        <div style="width:40px; height:40px; border:4px solid #eee; border-top:4px solid #4a9eff; border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 1rem;"></div>
        <p id="crawl-status">正在爬取圖片...</p>
        <p id="crawl-progress"></p>
    </div>
</div>


<script>
    
//const: never change, but could change value in object 
//let: could change 
const API = "http://127.0.0.1:8000";
const pageSize = 20;
let token = localStorage.getItem('token') || null
let User = localStorage.getItem('user') || null;
let selectedIds = new Set();
let currentArtistId = null;
let totalImages = 0;
let last_id = 0;
let isLoading = false;
const downloadIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;


//when window load, if token exist, show main page and load artists and images
window.onload = async () => {
    document.getElementById("user-info").textContent = User;
    const gallery = document.getElementById("gallery");
    gallery.addEventListener("scroll", () => {
        console.log("scroll triggered, isLoading:", isLoading);
        if (isLoading) return;
        if (gallery.scrollTop + gallery.clientHeight >= gallery.scrollHeight) {
            isLoading = true;
            loadImages(currentArtistId, true).finally(() => {
            isLoading = false;
            });
        } 
    });
    
    if (token) {
        const res = await fetch(`${API}/artists/`, {
            headers: { "Authorization": `Bearer ${token}` }
        });
        if (res.ok) {
            document.getElementById("login-page").style.display = "none";
            document.getElementById("main-page").style.display = "flex";
            loadArtists();
            loadImages();
        } else {
            localStorage.removeItem('token');
            token = null;
        }
    }
}


async function regist() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    console.log("Registering with", username, password);
    const res = await fetch(`${API}/auth/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
    });
    if (res.ok){
        alert("註冊成功");
    } else {
        alert("註冊失敗");
    }
}

async function login() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    User = username.trim();
    console.log("Logging in with", username, password);

    //fetch in js = client.post in py
    const res = await fetch(`${API}/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
    });
    console.log("Login response status:", res.status);
    //res.json: .json->object
    const data = await res.json();
    if (data.token) {
        token = data.token;

        //save token to localStorage, key = token, value = token
        localStorage.setItem('token', token);
        localStorage.setItem('user', username);
        
        console.log("Login successful, token:", token);
        console.log("Login successful, user:", username);
        console.log("Switching to main page...");
        //display none : hide login page
        //id = login-page
        document.getElementById("login-page").style.display = "none";
        //show main page by flex
        //id = main-page
        document.getElementById("main-page").style.display = "flex";
        //display username
        //id = user-info
        document.getElementById("user-info").textContent = username;
        loadArtists();
        loadImages();

    } else {
        console.log("Login failed:", data);
        alert("帳號或密碼錯誤");
    }
}

async function logout() {
    token = null;
    localStorage.removeItem('token');
    document.getElementById("main-page").style.display = "none";
    document.getElementById("login-page").style.display = "flex";
    document.getElementById("user-info").textContent = "";
    selectedIds.clear();
    updateCount();
    console.log("Logged out successfully.");
}

async function loadArtists() {
    console.log("Loading artists...");
    const res = await fetch(`${API}/artists/`, {
        headers: { "Authorization": `Bearer ${token}` }
    });
    const artists = await res.json();
    console.log("Loaded artists:", artists);
    //<div id="artist-list"></div>
    const list = document.getElementById("artist-list");
    /*
    add new button 全部
    use set: class = artist-item and class = active
    funct: filterArtist(null, this)
    */
    list.innerHTML = `<div class="artist-item active" onclick="filterArtist(null, this)">全部</div>`;
    artists.forEach(a => {
        list.innerHTML += `<div class="artist-item" onclick="filterArtist(${a.id}, this)">
            <span>${a.name}</span>
            <button onclick="deleteArtist(event, ${a.id})" style="float:right; background:transparent; border:none; color:#f66; cursor:pointer; font-size:14px;">✕</button>
            </div>`;
    });
}


async function deleteArtist(event, artistId) {
    event.stopPropagation();
    if (!confirm("確定要刪除這個創作者嗎？")) return;
    console.log("Deleting artist ID:", artistId);
    const res = await fetch(`${API}/artists/${artistId}`, {
        method: "DELETE",
        headers: { "Authorization": `Bearer ${token}` }
    });
    if (res.ok) {
        console.log("Artist deleted successfully, ID:", artistId);
        alert("刪除成功");
        if (currentArtistId === artistId) {
            currentArtistId = null;
        }
        loadArtists();
        loadImages();
    } else {
        const data = await res.json();
        console.log("Failed to delete artist:", data);
        alert(data.detail || "刪除失敗");
    }
}

async function loadImages(artistId = null, update = false) {

    if (!update){
        last_id = 0;
        console.log("Resetting last_id for new image load.");
    }

    console.log("Loading images...");
    let url = `${API}/images/`;
    url += `?size=${pageSize}`;
    if (last_id){
        url += `&last_id=${last_id}`;
    }

    if (artistId) url += `&artist_id=${artistId}`;

    console.log("Fetch URL:", url);
    const res = await fetch(url, {
        headers: { "Authorization": `Bearer ${token}` }
    });

    console.log("Images response status:", res.status);
    //convert json to object
    const images = await res.json();
    console.log("Loaded images:", images);

    totalImages = images.total;
    console.log(images);

    //find id = gallery
    const gallery = document.getElementById("gallery");

    if (update){
        console.log("loading more images...in same page");
    }
    else{
        //clear it
        gallery.innerHTML = "";
        console.log("refresh and loading images");
    }

    images.items.forEach(img => {
        //build <div>
        const card = document.createElement("div");
        
        //add class = image-card
        // <div> -> <div class= image-card>
        card.className = "image-card";
        //add data-id = img.id
        // <div class= image-card> -> <div class= image-card data-id = img.id>
        card.dataset.id = img.id;
        //checkbox = ☑️, when ☑️ do toggleSelect
        card.innerHTML = `
            <input type="checkbox" class="checkbox" onchange="toggleSelect(${img.id}, this)">
            <img src="${img.thumbnail_url || img.original_url}" 
                 onerror="this.src=''"
                 loading="lazy">
            ${img.is_downloaded ? `<div class="downloaded-badge">${downloadIcon}</div>` : ''}
        `;
        //like list.append()
        gallery.appendChild(card);
        last_id = img.id;
        console.log(`Added image card for image ID: ${img.id}`);
        
    });
    console.log("Finished loading images");
}


//only support solo select
function filterArtist(artistId, el) {

    console.log("Filtering images for artist ID:", artistId);
    //find all class = artist-itemm, remove active
    document.querySelectorAll(".artist-item").forEach(e => e.classList.remove("active"));

    el.classList.add("active");
    currentArtistId = artistId;
    //clear all image has been loading
    selectedIds.clear();
    updateCount();
    //reloading image with artistId
    loadImages(artistId);
    console.log("Filter applied, current artist ID:", currentArtistId);
}


function toggleSelect(id, checkbox) {

    console.log(`Toggling selection for image ID: ${id}`);
    const card = checkbox.closest(".image-card");
    /* 
    closet:findup class = image-card
    ex:
    <div class="image-card">        <- find this
        <input type="checkbox">     <- from here     
        <img src="...">
    </div>
    */

    if (checkbox.checked) {
        console.log(`Selecting image ID: ${id}`);
        selectedIds.add(id);
        card.classList.add("selected");
    } else {
        console.log(`Deselecting image ID: ${id}`);
        selectedIds.delete(id);
        card.classList.remove("selected");
    }
    updateCount();
}


function updateCount() {

    document.getElementById("selected-count").textContent = `已選取 ${selectedIds.size} 張`;
    console.log(`Updated selection count: ${selectedIds.size}`);   
}


async function downloadSelected() {

    if (selectedIds.size === 0) {
        console.log("No images selected for download.");
        alert("請先勾選圖片");
        return;
    }
    console.log("Downloading selected images, IDs:", [...selectedIds]);
    const res = await fetch(`${API}/images/download`, {
        method: "POST",
        headers: {
            "Authorization": `Bearer ${token}`,
            "Content-Type": "application/json"
        },
        //js object -> json
        //[...selectedIds]: set to list
        //...list in js = *list in py
        body: JSON.stringify({ image_ids: [...selectedIds] })
    });
    const data = await res.json();
    console.log("Download response:", data);
    alert(data.message);
}

async function deleteimage(){
    if (selectedIds.size == 0){
        console.log("No images selected for deletion.");
        alert("請先勾選圖片");
        return; 
    }
    console.log("Delete selected images, IDs:", [...selectedIds]);
    const res = await fetch(`${API}/images/del_image/`,{
        method: "POST",
        headers: {
            "Authorization": `Bearer ${token}`,
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ image_ids: [...selectedIds] })
    })
    if (res.ok){
        console.log("Images deleted successfully, IDs:", [...selectedIds]);
        alert("刪除成功");
        selectedIds.clear();
        updateCount();
        loadImages();
    }
    else{
        const data = await res.json();
        console.log("Failed to delete images:", data);
        alert(data.detail || "刪除失敗");
    }
}


async function searchImages() {
    //trim() remove space ex." hello world"-> "hello world" 
    //get id = search-tag value
    const tag = document.getElementById("search-tag").value.trim();
    if (!tag) return;
    
    console.log("Searching images with tag:", tag);
    //call images/search in back
    let url = `${API}/images/search?tag=${encodeURIComponent(tag)}`;
    /*
    tag may contain chinese or others transfer it to safe word avoid error
    */
    console.log("Constructed search URL:", url);
    if (currentArtistId) url += `&artist_id=${currentArtistId}`;
    
    console.log("Final search URL:", url);
    const res = await fetch(url, {
        headers: { "Authorization": `Bearer ${token}` }
    });
    console.log("Search response status:", res.status);
    const images = await res.json();
    


    const gallery = document.getElementById("gallery");
    gallery.innerHTML = "";
    images.forEach(img => {
        const card = document.createElement("div");
        card.className = "image-card";
        card.dataset.id = img.id;
        card.innerHTML = `
            <input type="checkbox" class="checkbox" onchange="toggleSelect(${img.id}, this)">
            <img src="${img.thumbnail_url || img.original_url}" 
                 onerror="this.src=''"  //when loading fail, space it
                 loading="lazy">
                 ${img.is_downloaded ? `<div class="downloaded-badge">${downloadIcon}</div>` : ''}`;
        gallery.appendChild(card);
        console.log("Added image card for search result, image ID: ${img.id}");
    });
    console.log("Finished loading search results");
}


function toggleAddArtist() {

    const form = document.getElementById("add-artist-form");
    form.style.display = form.style.display === "none" ? "block" : "none";
    /*
    form.style.display = "block" if form.style.display == "none" else "none"
    */
    console.log("Toggled add artist form, now:", form.style.display);
}


async function addArtist() {
    console.log("Attempting to add artist...");
    /*get name and url from input*/
    const name = document.getElementById("artist-name").value.trim();
    const platform = document.getElementById("artist-platform").value.trim();
    console.log("Artist name:", name, "Platform:", platform);   

    if (!name) {
        alert("請填寫名稱");
        console.log("Artist name is empty, aborting add artist.");
        return;
    }

    const url = `https://www.artstation.com/${name}`;

    console.log("Constructed artist URL:", url);
    const res = await fetch(`${API}/artists/`, {
        method: "POST",
        headers: {
            "Authorization": `Bearer ${token}`,
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ name, url, platform })
    });
    
    const data = await res.json();
    console.log("Add artist response:", data.status)

    if (res.ok) {
        console.log("Artist added successfully, ID:", data.id);
        const artistId = data.id;

        //show crawling modal
        isLoading = true;
        document.getElementById("crawl-modal").style.display = "flex";
        
        console.log("Triggering crawl for artist ID:", artistId);
        // 觸發爬蟲
        await fetch(`${API}/crawl/${artistId}`, {
            method: "POST",
            headers: { "Authorization": `Bearer ${token}` }
        });

        console.log("Crawl triggered for artist ID: ${artistId} success");

        //update crawl status
        document.getElementById("crawl-status").textContent = "爬取完成！";
        const Res_artists = await fetch(`${API}/artist/${name}`,{
            method: "GET",
            headers: { "Authorization": `Bearer ${token}` }
        });
        const artist_json = await Res_artists.json();
        document.getElementById("crawl-progress").textContent = `共爬取 ${artist_json.image_count} 張圖片`;

        //hide modal after 1s, reload artists and images
        setTimeout(async () => {
            document.getElementById("crawl-modal").style.display = "none";
            document.getElementById("add-artist-form").style.display = "none";
            document.getElementById("artist-name").value = "";
            loadArtists();
            await loadImages();
            isLoading = false;
        }, 2000);
        console.log("Reloaded artists and images after adding new artist.");
    }
    else {
        console.log("Failed to add artist:", data);
        alert(data.detail || "新增失敗");
    }
}





</script>
</body>
</html>
